name: Migration parity checks
on:
  push:
    branches:
      - migration/hostinger-parity
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies from committed lockfile
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun run test
      - name: Production build (existing baseline configuration)
        run: bun run build
      - name: Inspect server build artifacts (no deployment)
        run: |
          echo "Top-level build artifacts:"
          ls -la .output 2>/dev/null || true
          echo "Server entries:"
          find .output -maxdepth 3 -type f \( -name 'index.mjs' -o -name 'index.js' -o -name 'package.json' \) -print 2>/dev/null | head -40
          echo "Nitro configuration references:"
          find .output -maxdepth 2 -type f -name '*.json' -print 2>/dev/null | head -20
      - name: Hostinger Node server build
        env:
          IEP_DEPLOY_TARGET: hostinger
        run: bun run build
      - name: Verify Node runtime output
        run: |
          test -f .output/server/index.mjs
          test ! -f .output/server/wrangler.json
          timeout 12s node .output/server/index.mjs > /tmp/iep-node.log 2>&1 &
          PID=$!
          sleep 3
          if ! kill -0 "$PID" 2>/dev/null; then
            cat /tmp/iep-node.log
            exit 1
          fi
          kill "$PID" || true
          wait "$PID" || true
          echo "Node process started successfully"
