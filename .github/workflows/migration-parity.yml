name: Migration parity checks
on:
  push:
    branches:
      - migration/hostinger-parity
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies from committed lockfile
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun run test
      - name: Production build (existing baseline configuration)
        run: bun run build
      - name: Inspect server build artifacts (no deployment)
        run: |
          echo "Top-level build artifacts:"
          ls -la .output 2>/dev/null || true
          echo "Server entries:"
          find .output -maxdepth 3 -type f \( -name 'index.mjs' -o -name 'index.js' -o -name 'package.json' \) -print 2>/dev/null | head -40
          echo "Nitro configuration references:"
          find .output -maxdepth 2 -type f -name '*.json' -print 2>/dev/null | head -20
      - name: Hostinger Node server build
        env:
          IEP_DEPLOY_TARGET: hostinger
        run: bun run build
      - name: Verify Node runtime output
        run: |
          test -f .output/server/index.mjs
          test ! -f .output/server/wrangler.json
          timeout 12s node .output/server/index.mjs > /tmp/iep-node.log 2>&1 &
          PID=$!
          sleep 3
          if ! kill -0 "$PID" 2>/dev/null; then
            cat /tmp/iep-node.log
            exit 1
          fi
          kill "$PID" || true
          wait "$PID" || true
          echo "Node process started successfully"
      - name: HTTP smoke test on Node server
        run: |
          set -euo pipefail
          PORT=32987 HOST=127.0.0.1 node .output/server/index.mjs > /tmp/iep-http.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          READY=0
          for attempt in $(seq 1 20); do
            if curl --silent --output /tmp/iep-response.html --write-out '%{http_code}' http://127.0.0.1:32987/ > /tmp/iep-status; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Node server did not accept HTTP requests"
            cat /tmp/iep-http.log
            exit 1
          fi
          STATUS=$(cat /tmp/iep-status)
          echo "HTTP / status: $STATUS"
          if [ "$STATUS" -ge 500 ]; then
            echo "SSR returned a server error"
            tail -80 /tmp/iep-http.log
            exit 1
          fi
          if [ "$STATUS" -ne 200 ]; then
            echo "Unexpected homepage status: $STATUS"
            exit 1
          fi
          grep -qi '<html' /tmp/iep-response.html
          echo "HTTP smoke test passed"
      - name: Verify protected API endpoints reject anonymous access
        run: |
          set -euo pipefail
          PORT=32988 HOST=127.0.0.1 node .output/server/index.mjs > /tmp/iep-auth.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:32988/ > /dev/null 2>&1; then break; fi
            sleep 1
          done
          for endpoint in audit reviews; do
            STATUS=$(curl -sS -o /tmp/iep-protected.json -w '%{http_code}' -X POST "http://127.0.0.1:32988/api/$endpoint" -H 'Content-Type: application/json' -d '{}')
            echo "/api/$endpoint anonymous HTTP: $STATUS"
            test "$STATUS" = "401"
          done
