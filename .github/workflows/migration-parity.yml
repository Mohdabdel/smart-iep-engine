name: Migration parity checks
on:
  push:
    branches:
      - migration/hostinger-parity
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies from committed lockfile
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun run test
      - name: Production build (existing baseline configuration)
        run: bun run build
