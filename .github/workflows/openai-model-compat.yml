name: OpenAI model compatibility (live, synthetic data)
# Verifies a candidate direct-OpenAI model against the real review code path.
# Needs repository SECRET OPENAI_API_KEY (never printed). Candidate model from
# the dispatch input, else repository variable IEP_OPENAI_MODEL_CANDIDATE,
# else gpt-5.1. Uses a synthetic plan only.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "OpenAI model id to test"
        required: false
        default: ""
  push:
    branches:
      - migration/hostinger-parity
    paths:
      # Bump this file to re-run after the owner adds the OPENAI_API_KEY secret.
      - .github/openai-compat-trigger
permissions:
  contents: read
jobs:
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_LIVE_CHECK: "1"
      IEP_AI_PROVIDER: openai
      IEP_OPENAI_MODEL: ${{ inputs.model || vars.IEP_OPENAI_MODEL_CANDIDATE || 'gpt-5.1' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Require OPENAI_API_KEY secret
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Repository secret OPENAI_API_KEY is not set - nothing tested."
            exit 1
          fi
          echo "Candidate model: $IEP_OPENAI_MODEL"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      - name: Model is listed for this API key
        run: |
          code=$(curl -s -o /tmp/model.json -w '%{http_code}' https://api.openai.com/v1/models/"$IEP_OPENAI_MODEL" -H "Authorization: Bearer $OPENAI_API_KEY")
          detail=$(jq -r '[.error.code // empty, .error.type // empty] | join("/")' /tmp/model.json 2>/dev/null || true)
          if [ "$code" = "200" ]; then
            echo "::notice title=Model check::$IEP_OPENAI_MODEL is available for this key (HTTP 200)"
          else
            echo "::error title=Model check::GET /v1/models/$IEP_OPENAI_MODEL -> HTTP $code ${detail}"
            exit 1
          fi
      - name: Live review parts via real code path (synthetic plan)
        run: |
          set -o pipefail
          bunx vitest run src/lib/openai-live-compat.test.ts --reporter=verbose 2>&1 | tee /tmp/compat.log || status=$?
          grep -E '\[compat\]' /tmp/compat.log | while read -r line; do echo "::notice title=Part ok::$line"; done
          grep -E '(×|FAIL|AI_APICallError|AI_NoObjectGeneratedError|Error:)' /tmp/compat.log | grep -v 'sk-' | head -8 | while read -r line; do echo "::error title=Compat failure::${line:0:300}"; done
          exit ${status:-0}
